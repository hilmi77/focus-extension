<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Focus</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup">

    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="focus">Odak</button>
      <button class="tab-btn" data-tab="notes">Notlar</button>
      <button class="tab-btn" data-tab="sites">Siteler</button>
    </nav>

    <!-- ── Odak ── -->
    <div class="tab-panel active" id="tab-focus">

      <section class="pomodoro-section" id="pomoSection">
        <div class="pomodoro-header">
          <span class="pomo-phase" id="pomoPhase">Hazır</span>
          <span class="pomo-rounds" id="pomoRounds">
            <span class="round-dot" data-idx="0"></span>
            <span class="round-dot" data-idx="1"></span>
            <span class="round-dot" data-idx="2"></span>
            <span class="round-dot" data-idx="3"></span>
          </span>
        </div>
        <div class="pomo-timer-row">
          <div class="pomo-timer" id="pomoTimer">25:00</div>
          <button class="pomo-reset-btn hidden" id="pomoResetBtn" title="Sıfırla">×</button>
        </div>
        <div class="pomo-controls">
          <button class="pomo-btn pomo-start" id="pomoStartBtn">Başlat</button>
          <button class="pomo-btn pomo-pause hidden" id="pomoPauseBtn">Duraklat</button>
          <button class="pomo-btn pomo-resume hidden" id="pomoResumeBtn">Devam Et</button>
        </div>
        <div class="pomo-settings">
          <label class="pomo-setting">
            <span class="pomo-setting-label">Çalışma</span>
            <input type="number" id="pomoWorkMins" min="1" max="120" value="25" />
            <span>dk</span>
          </label>
          <label class="pomo-setting">
            <span class="pomo-setting-label">Mola</span>
            <input type="number" id="pomoBreakMins" min="1" max="60" value="5" />
            <span>dk</span>
          </label>
          <label class="pomo-setting">
            <span class="pomo-setting-label">Uzun mola</span>
            <input type="number" id="pomoLongMins" min="1" max="120" value="15" />
            <span>dk</span>
          </label>
        </div>
        <div class="pomo-sound">
          <div class="sound-modes" role="group" aria-label="Ses modu">
            <button type="button" class="sound-mode-btn" data-mode="off">🔇 Kapalı</button>
            <button type="button" class="sound-mode-btn" data-mode="whitenoise">🌊 Gürültü</button>
            <button type="button" class="sound-mode-btn" data-mode="classic">🎼 Müzik</button>
          </div>
          <div class="now-playing hidden" id="nowPlaying">
            <span class="now-playing-label">🎻 Radio Swiss Classic</span>
            <span class="now-playing-track" id="nowPlayingTrack">Yükleniyor…</span>
          </div>
          <button type="button" class="sound-toggle-btn hidden" id="soundToggleBtn" title="Sesi durdur/oynat">⏸ Sesi durdur</button>
        </div>
      </section>

      <section class="stats">
        <div class="stat-card">
          <span class="stat-value" id="todayRounds">0</span>
          <span class="stat-label">🍅 tur</span>
          <span class="stat-hint">tamamlanan</span>
        </div>
        <div class="stat-card">
          <span class="stat-value stat-value--sm" id="todayFocusMins">0dk</span>
          <span class="stat-label">⏱ çalışma</span>
          <span class="stat-hint">bugün toplam</span>
        </div>
        <div class="stat-card">
          <span class="stat-value stat-value--sm" id="todayBreakMins">0dk</span>
          <span class="stat-label">☕ mola</span>
          <span class="stat-hint">tahmini toplam</span>
        </div>
      </section>

      <section class="goal-section">
        <div class="goal-header">
          <div>
            <span class="goal-label">Günlük hedef</span>
            <p class="goal-sublabel">bugün kaç pomodoro tamamlamak istiyorsun?</p>
          </div>
          <div class="goal-input-row">
            <input type="number" id="goalInput" min="1" max="20" value="8" />
            <span class="goal-unit">tur</span>
          </div>
        </div>
        <p class="goal-hint" id="goalHint"></p>
        <div class="goal-bar-track">
          <div class="goal-bar-fill" id="goalBarFill"></div>
        </div>
        <div class="goal-footer">
          <p class="goal-progress-text" id="goalProgressText">0 / 8 tur tamamlandı</p>
          <button class="goal-reset-btn" id="goalResetBtn">Sıfırla</button>
        </div>
      </section>

    </div>

    <!-- ── Notlar ── -->
    <div class="tab-panel" id="tab-notes">
      <div class="notes-header">
        <span class="notes-title">Notlar</span>
        <button class="notes-clear-btn hidden" id="notesClearBtn">Tümünü sil</button>
      </div>
      <ul class="notes-list" id="notesList"></ul>
      <div class="notes-input-row">
        <input type="text" id="noteInput" class="input" placeholder="Yeni not ekle…" />
        <button class="notes-add-btn" id="noteAddBtn">+</button>
      </div>
    </div>

    <!-- ── Siteler ── -->
    <div class="tab-panel" id="tab-sites">

      <ul class="site-list" id="siteList"></ul>

      <div class="edit-modal hidden" id="editModal">
        <p class="edit-title">Düzenle</p>
        <div class="input-row">
          <input type="text" id="editSource" class="input" placeholder="instagram.com" />
          <span class="arrow">→</span>
          <input type="text" id="editTarget" class="input" placeholder="https://react.dev" />
        </div>
        <div class="edit-actions">
          <button class="cancel-btn" id="editCancelBtn">İptal</button>
          <button class="add-btn" id="editSaveBtn">Kaydet</button>
        </div>
      </div>

      <section class="add-section" id="addSection">
        <div class="input-row">
          <input type="text" id="sourceInput" class="input" placeholder="instagram.com" />
          <span class="arrow">→</span>
          <input type="text" id="targetInput" class="input" placeholder="https://react.dev" />
        </div>
        <button class="add-btn" id="addBtn">Ekle</button>
      </section>

    </div>

  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
