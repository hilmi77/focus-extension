# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI PR review ayarları — https://docs.coderabbit.ai/reference/configuration

language: tr
tone_instructions: "Kısa ve net ol. Sadece gerçek hataları, güvenlik sorunlarını ve Chrome extension (MV3) kurallarına aykırılıkları yaz; zevk meselesi stil yorumu yapma."

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false

  auto_review:
    enabled: true
    drafts: false
    # Varsayılan branch (main) hedefli PR'lar her zaman incelenir.
    # ".*" ile başka bir dala (örn. feature -> feature) açılan PR'lar da incelenir.
    base_branches:
      - ".*"

  path_filters:
    - "!.idea/**"
    - "!**/.DS_Store"
    - "!icons/**"
    - "!images/**"
    - "!docs/**"

  path_instructions:
    - path: "manifest.json"
      instructions: |
        - Yeni eklenen `permissions` / `host_permissions` gerçekten gerekli mi sorgula; gereksiz geniş izinleri (ör. `<all_urls>`) belirt.
        - `web_accessible_resources` listesine eklenen dosyaların dışarıya açılmasının güvenli olduğunu kontrol et.
    - path: "background.js"
      instructions: |
        - MV3 service worker her an uyutulabilir: global değişkende tutulan state kaybolur. Kalıcı olması gereken veri `chrome.storage` ile saklanmalı.
        - Zamanlayıcılar için `setTimeout`/`setInterval` yerine `chrome.alarms` kullanılmalı.
        - Event listener'lar (`chrome.runtime.onMessage`, `webNavigation`, `alarms` vb.) top-level'da ve senkron kaydedilmeli; async bir işlemin içinde kaydediliyorsa belirt.
    - path: "{popup,blocked,offscreen}.{js,html}"
      instructions: |
        - `innerHTML` ile kullanıcı verisi (site adı, URL vb.) basılıyorsa XSS riski olarak işaretle; `textContent` önerilir.
        - Inline `<script>` veya inline event handler (`onclick=` gibi) MV3 CSP'de çalışmaz; varsa belirt.
    - path: "utils.js"
      instructions: |
        - Buradaki fonksiyonların `tests/utils.test.mjs` içinde testi var. Davranışı değişen veya yeni eklenen fonksiyonun testi eklenmemişse hatırlat.
    - path: "tests/**"
      instructions: |
        - Testler `node:test` ve `node:assert/strict` ile yazılıyor; farklı bir test kütüphanesi eklenmemeli.

chat:
  auto_reply: true
